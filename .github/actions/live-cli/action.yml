name: Live CLI suite
description: Build a disposable PROxyLLM instance, run every supported CLI, return the report table.

inputs:
  ollama-cloud-api-key:
    description: Ollama Cloud key used by the ephemeral instance
    required: true

outputs:
  report:
    description: Markdown table of per-CLI phase results
    value: ${{ steps.phases.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - uses: actions/setup-node@v7
      with:
        node-version: 26.13.0
        cache: npm
        cache-dependency-path: webui/package-lock.json

    - name: Install CLIs (latest release, never pinned)
      shell: bash
      run: |
        npm install -g \
          @anthropic-ai/claude-code \
          @openai/codex \
          opencode-ai \
          @moonshot-ai/kimi-code \
          @qwen-code/qwen-code \
          @continuedev/cli \
          cline
        python3 -m pip install --user uv
        "$HOME/.local/bin/uv" tool install aider-chat --python 3.12
        # The goose install_cli.sh ends in an interactive "Configuring
        # goose" step that reads /dev/tty; install the release binary
        # directly instead.
        curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
        mkdir -p /tmp/goose-extract
        tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-extract
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$(find /tmp/goose-extract -type f -name goose | head -1)" "$HOME/.local/bin/goose"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Verify CLI versions
      shell: bash
      run: |
        python3 -I .github/live-cli/clients.py list | python3 -I -c '
        import json, sys
        rows = json.load(sys.stdin)
        missing = [r["name"] for r in rows if r["runnable"] and not r["installed"]]
        print("missing CLIs:", missing)
        sys.exit(1 if missing else 0)
        '

    - name: Build
      shell: bash
      run: make build

    - name: Bootstrap instance
      shell: bash
      env:
        OLLAMA_CLOUD_API_KEY: ${{ inputs.ollama-cloud-api-key }}
      run: |
        python3 -I .github/live-cli/bootstrap.py \
          --home "$PROXYLLM_TEST_HOME" \
          --chat-model "$CHAT_MODEL" \
          --fallback-model "$FALLBACK_MODEL"

    - name: Start instance
      shell: bash
      run: |
        mkdir -p "$PROXYLLM_TEST_HOME/logs" "$PROXYLLM_TEST_HOME/run"
        PROXYLLM_SERVER_ADDR=127.0.0.1:18080 \
        PROXYLLM_STORAGE_PATH="$PROXYLLM_TEST_HOME/data/proxyllm.db" \
        PROXYLLM_MASTER_KEY_PATH="$PROXYLLM_TEST_HOME/data/master.key" \
        PROXYLLM_LOG_FORMAT=json \
        PROXYLLM_LOG_LEVEL=info \
        ./proxyllm >"$PROXYLLM_TEST_HOME/logs/proxyllm.log" 2>&1 &
        echo $! > "$PROXYLLM_TEST_HOME/run/proxyllm.pid"
        for _ in $(seq 1 80); do
          if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
            exit 0
          fi
          sleep 0.25
        done
        cat "$PROXYLLM_TEST_HOME/logs/proxyllm.log"
        exit 1

    - name: Configure instance
      shell: bash
      run: python3 -I .github/live-cli/admin.py --home "$PROXYLLM_TEST_HOME" setup

    - name: Run live CLI phases
      id: phases
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
      run: |
        set -e
        python3 -I .github/live-cli/live_cli.py --home "$PROXYLLM_TEST_HOME"
        report=$(find "$PROXYLLM_TEST_HOME/artifacts" -name report.md | head -1)
        test -n "$report"
        {
          echo "report<<LIVE_CLI_REPORT_EOF"
          awk '/^\| CLI /{p=1} p' "$report"
          echo "LIVE_CLI_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: live-cli-report
        path: |
          ${{ github.workspace }}/.live-cli/artifacts/**
          ${{ github.workspace }}/.live-cli/clients/**/result.json
        retention-days: 7
        if-no-files-found: error

    - name: Stop instance
      if: always()
      shell: bash
      run: |
        if [ -f "$PROXYLLM_TEST_HOME/run/proxyllm.pid" ]; then
          kill "$(cat "$PROXYLLM_TEST_HOME/run/proxyllm.pid")" 2>/dev/null || true
        fi
