name: matrix

# Protocol conformance matrix: every client surface against every upstream
# wire, with MockServer (an established open-source LLM mock server) producing
# the provider's real response shape — streaming, tool calls and fault
# profiles included. No provider key, no GPU.
#
# Local run:
#   java -jar mockserver.jar -serverPort 1080
#   MOCKSERVER_URL=http://127.0.0.1:1080 go test ./internal/e2e -run TestMatrix_ -v

on:
  push:
    branches: [main]
    paths:
      - "internal/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/test-matrix/**"
      - ".github/live-cli/adapters/**"
      - ".github/workflows/matrix.yml"
  pull_request:
    paths:
      - "internal/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/test-matrix/**"
      - ".github/live-cli/adapters/**"
      - ".github/workflows/matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep the push run and a manual dispatch on the same ref in separate
  # groups: dispatching must not cancel the run that gates the push.
  group: matrix-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mockserver:
        image: mockserver/mockserver:9.2.0
        ports:
          - 1080:1080
    env:
      MOCKSERVER_URL: http://127.0.0.1:1080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Gate self-tests (negative controls)
        run: python3 -I .github/test-matrix/test_gates.py
      - name: Manifest gate (cells and tests must agree)
        run: python3 -I .github/test-matrix/check_manifest.py
      - name: Protocol conformance matrix (run twice for determinism)
        run: go test ./internal/e2e/ -run 'TestMatrix_' -v -count=2

  cli-plain:
    # M2: every CLI started the way a user starts it — the bare binary in a
    # pseudo-terminal, only its own config pointing at the proxy, upstream
    # = MockServer. Deterministic and keyless, like the conformance matrix.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mockserver:
        image: mockserver/mockserver:9.2.0
        ports:
          - 1080:1080
    env:
      MOCKSERVER_URL: http://127.0.0.1:1080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
      - name: "Install CLIs (plain-start scope: codex, claude-code, crush)"
        run: npm install -g @openai/codex@0.166.0 @anthropic-ai/claude-code@2.1.316 @charmland/crush@0.99.0
      - name: Install OpenHands CLI (last released terminal CLI, pinned)
        run: |
          pipx install "openhands-ai==0.59.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install gptme CLI (pinned)
        run: |
          pipx install "gptme==0.36.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Open Interpreter CLI (pinned release tarball; Codex fork, no npm/pipx package)
        run: |
          sudo mkdir -p /usr/local/lib/open-interpreter
          # The sudo mkdir leaves a root-owned dir; the unprivileged tar it
          # fed stopped being able to write it on the runner image.
          curl -fsSL https://github.com/openinterpreter/openinterpreter/releases/download/rust-v0.0.58/open-interpreter-package-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz -C /usr/local/lib/open-interpreter
          sudo ln -s /usr/local/lib/open-interpreter/bin/interpreter /usr/local/bin/interpreter
          interpreter --version
      - name: Install aider CLI (pinned; aider-chat requires python <3.13)
        run: |
          pipx install --python 3.12 "aider-chat==0.86.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install cline CLI (pinned)
        run: npm install -g cline@3.0.74
      - name: Install goose CLI (pinned release tarball; the download script ends in an interactive configure step that reads /dev/tty)
        run: |
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/v1.57.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
          mkdir -p /tmp/goose-extract
          tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-extract
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find /tmp/goose-extract -type f -name goose | head -1)" "$HOME/.local/bin/goose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Kimi Code CLI (pinned)
        run: npm install -g @moonshot-ai/kimi-code@2.4.1
      - name: Install Qwen Code CLI (pinned)
        run: npm install -g @qwen-code/qwen-code@0.26.6
      - name: Install OpenCode CLI (pinned)
        run: npm install -g opencode-ai@1.19.5
      - name: Ensure tmux (the plain-start driver runs CLIs in a pseudo-terminal)
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          fi
          tmux -V
      - name: Build the proxy
        run: env -u GOROOT make build
      - name: Plain-start CLI matrix
        # continue is local-only (docs/test-matrix.md): cn 1.5.47's
        # plain-start TUI never mounts its composer on ubuntu-24.04 runners
        # (Ink paints exactly 2 frames then stalls; no blocked syscall, no
        # network wait) while it mounts locally in every variant — frame
        # probe #114, strace #113, boot trace #112/#111, deep dives
        # #108–#115. Locally verified green: 2x full 26/26 on the #114
        # lineage incl. node 26/27 variance. Re-entry: pane artifacts under
        # cli-plain-matrix proving the composer mounts.
        run: python3 -I .github/test-matrix/cli_plain.py --home /tmp/plain-matrix --mockserver "$MOCKSERVER_URL" --clients codex,claude-code,crush,openhands,gptme,open-interpreter,aider,cline,goose,kimi,qwen,opencode --scenarios answer,recall
      - name: Upload CLI matrix evidence (panes, client logs, proxy log)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-plain-matrix
          # The driver writes per-cell pane.log + client-logs/ under the run
          # dirs and the proxy log under logs/; only those are uploaded, not
          # the CLI homes (cache dirs can be hundreds of MB).
          path: |
            /tmp/plain-matrix/logs/
            /tmp/plain-matrix/clients/*/*/*.log
            /tmp/plain-matrix/clients/*/*/client-logs/
          if-no-files-found: ignore
          retention-days: 7
