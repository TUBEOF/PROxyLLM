name: Release

# Tag-triggered release pipeline (phase 3, research R-1..R-4):
#   1. npm run build (real SPA bundle, embedded into the binary)
#   2. GoReleaser: per-OS/arch binary archives as GitHub Release assets +
#      multi-arch Docker images pushed to GHCR (amd64 + arm64 manifest list)
# GoReleaser needs contents: write for the GitHub Release; the GHCR push
# needs packages: write (R-4).

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # Hard release gate (plan §8): the §8 perf budgets block release. The CI
  # benchmark job runs the same tests on main non-blocking; here the budget
  # assertions in TestPerfBudgets fail the tag build loudly.
  perf-budgets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./internal/e2e -run TestPerfBudgets -v -count=1

  release:
    needs: [perf-budgets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      # QEMU + buildx for the arm64 image leg (research R-2); login before
      # GoReleaser because its publish phase pushes during the run.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # The binary embeds the SPA (go:embed webui/dist) — build the real
      # bundle before GoReleaser compiles, never the committed placeholder.
      - name: build SPA
        working-directory: webui
        run: npm ci && npm run build

      # GHCR login BEFORE GoReleaser: the dockers/docker_manifests publish
      # phase pushes during the GoReleaser run and needs the credentials
      # already present.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # go:embed reads webui/dist at compile time; GoReleaser's build step
      # must see the real assets. (The committed dist/index.html placeholder
      # is replaced in the working tree only — it stays committed for
      # fresh-clone compiles.) GoReleaser requires a clean git state and has
      # no allowlist for dirty files, so tell git to ignore changes to
      # exactly that placeholder: the working tree keeps the real bundle
      # for go:embed, while any OTHER modified file still fails GoReleaser.
      - name: ignore dist placeholder churn
        run: git update-index --assume-unchanged webui/dist/index.html
      - name: run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
