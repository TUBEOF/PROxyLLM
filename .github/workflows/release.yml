name: Release

# Tag-triggered release pipeline:
#   1. real-CLI suite (inline composite action; logs stream in this job)
#   2. perf-budget gate
#   3. GoReleaser: archives + multi-arch GHCR images
#   4. append the per-CLI table to the release notes

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  PROXYLLM_TEST_HOME: ${{ github.workspace }}/.live-cli
  PYTHONUNBUFFERED: "1"
  CHAT_MODEL: deepseek-v4.1-flash:1017
  FALLBACK_MODEL: nemotron-3-ultra

jobs:
  # Hard release gate: the perf budgets block release. The CI
  # benchmark job runs the same tests on main non-blocking; here the budget
  # assertions in TestPerfBudgets fail the tag build loudly.
  perf-budgets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./internal/e2e -run TestPerfBudgets -v -count=1

  release:
    needs: [perf-budgets]
    runs-on: ubuntu-24.04
    environment: live-cli
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Inline the live suite so its steps appear in this job's log. The
      # action installs Go/Node and returns the Markdown table as an output.
      - uses: ./.github/actions/live-cli
        id: live
        with:
          ollama-cloud-api-key: ${{ secrets.OLLAMA_CLOUD_API_KEY }}

      # QEMU + buildx for the arm64 image leg; login before GoReleaser
      # because its publish phase pushes during the run.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # The binary embeds the SPA (go:embed webui/dist) — build the real
      # bundle before GoReleaser compiles, never the committed placeholder.
      - name: build SPA
        working-directory: webui
        run: npm ci && npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Verify the report BEFORE GoReleaser: once a release is published,
      # a missing report can no longer block it.
      - name: Write live CLI report
        env:
          REPORT: ${{ steps.live.outputs.report }}
        run: |
          test -n "$REPORT"
          printf '%s\n' "$REPORT" > /tmp/cli-report.md
          grep -q '^| CLI ' /tmp/cli-report.md

      # go:embed reads webui/dist at compile time; GoReleaser requires a
      # clean git state and has no allowlist for dirty files, so tell git to
      # ignore changes to exactly that placeholder.
      - name: ignore dist placeholder churn
        run: git update-index --assume-unchanged webui/dist/index.html

      - name: run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned, not `latest`: a release must be reproducible.
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append per-CLI results to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ ! -s /tmp/cli-report.md ]; then
            echo "live CLI report missing; refusing to publish a release without CLI results" >&2
            exit 1
          fi
          gh release view "$TAG" --json body -q .body > /tmp/release-body.md
          {
            echo
            echo "## Live CLI test results"
            echo
            cat /tmp/cli-report.md
          } >> /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md
