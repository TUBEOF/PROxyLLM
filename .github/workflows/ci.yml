name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, and the target of the explicit re-dispatch from
  # update-visual-baselines.yml: a baseline commit pushed with GITHUB_TOKEN
  # cannot create a workflow run (GitHub suppresses token-triggered events,
  # workflow_dispatch/repository_dispatch excepted), so the refresh workflow
  # dispatches this one by name instead of relying on a push event. That is what
  # replaced the old throwaway "trigger CI after baseline regen" empty commit.
  workflow_dispatch:

permissions:
  # security-events: write — the CodeQL analyze step uploads its SARIF
  # results; with only contents: read it fails with
  # "Resource not accessible by integration".
  # actions: read — the same step queries the workflow-run API for its
  # status reporting; on private repos the GITHUB_TOKEN integration
  # refuses that call without it (the upload aborts with
  # "Resource not accessible by integration").
  contents: read
  security-events: write
  actions: read
  # pull-requests: read — gitleaks-action in PR mode lists the PR's
  # commits; without this scope it aborts with 403 "Resource not
  # accessible by integration" (security job, PR events only).
  pull-requests: read

env:
  # Go packages scoped to the module's own code — `./...` would descend
  # into webui/node_modules (some npm packages ship Go sources) and break
  # vet/test/lint runs (Makefile GO_PKGS parity).
  GO_PKGS: ./cmd/... ./internal/... ./webui

jobs:
  # Gate 1: lint + format + static analysis — blocking
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt check
        run: test -z "$(gofmt -l cmd internal webui/embed.go)"
      - name: go vet
        run: |
          # $GO_PKGS is a deliberate word-split: it expands to three package
          # patterns, and quoting it would pass them as one bogus argument.
          # shellcheck disable=SC2086
          go vet $GO_PKGS
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      # A test that is deleted, weakened or skipped still reports green, so the
      # suite can rot without a single failure. This refuses those changes; it
      # needs the base branch, which the default shallow checkout does not have.
      - name: test erosion
        run: |
          git fetch --no-tags --depth=1 origin main
          go run ./cmd/checktests -base origin/main

  # Gate 2+3: unit + contract tests with race detector — blocking
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go test -race
        run: |
          # Same deliberate word-split as the vet step above.
          # shellcheck disable=SC2086
          go test -race $GO_PKGS
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  # Gate 5: secret scan + SAST + dependency audit — blocking
  # gosec rides Gate 1 via golangci-lint (gosec linter enabled, nolintlint
  # enforcing annotated suppressions) — a standalone gosec CLI run would
  # ignore the //nolint:gosec annotations and double-report.
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit path rather than relying on the action's auto-detection:
          # .gitleaks.toml carries one narrow allowance (the entropy heuristic
          # cannot tell a synthetic test fixture from a real key), and which files
          # it applies to should not depend on the action's version.
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: CodeQL
        # Code scanning on private repos requires GitHub Advanced Security
        # (a paid plan feature). The workflow cannot enable it; if the
        # repo is private without GHAS, skip the SAST leg with a visible
        # notice instead of failing the gate on a settings limitation.
        # gitleaks and the gosec linter in Gate 1 still run regardless.
        # Gated on the boolean `repository.private`: the string
        # `repository.visibility` field is absent from some event payloads, so
        # comparing it silently evaluated false and skipped an enabled scanner.
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: CodeQL analyze
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/analyze@v4
      - name: CodeQL skipped (no GHAS on private repo)
        if: ${{ github.event.repository.private }}
        run: |
          echo "::notice::CodeQL skipped: code scanning needs GitHub Advanced Security on private repos. Make the repo public or enable GHAS in Settings → Code security."

  # Gate 4: WebUI build + bundle budget — blocking. The Playwright suites moved
  # to visual-regression.yml (2026-10-10): the assertion suite still blocks, but
  # only on PRs that touch UI paths, and the baseline comparison only reports.
  webui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: npm ci
        working-directory: webui
        run: npm ci
      - name: lint
        working-directory: webui
        run: npm run lint
      - name: typecheck (src)
        working-directory: webui
        run: npm run typecheck
      - name: typecheck (e2e)
        working-directory: webui
        run: npx tsc --noEmit -p tsconfig.e2e.json
      # npm run build overwrites the committed dist placeholder with the
      # real bundle — required here so the Go embed picks up real assets.
      - name: build SPA
        working-directory: webui
        run: npm run build
      - name: bundle budget (≤ 200 KB gzip initial load)
        working-directory: webui
        run: |
          total=$(node -e '
            const fs = require("fs");
            const zlib = require("zlib");
            const html = fs.readFileSync("dist/index.html", "utf8");
            const refs = [...html.matchAll(/(?:src|href)="(\/?assets\/[^"]+)"/g)].map((m) => m[1]);
            let gz = 0;
            for (const r of refs) {
              const p = r.startsWith("/") ? r.slice(1) : r;
              gz += zlib.gzipSync(fs.readFileSync("dist/" + p)).length;
            }
            gz += zlib.gzipSync(fs.readFileSync("dist/index.html")).length;
            console.log(gz);
          ')
          echo "initial load: ${total} bytes gzip"
          if [ "$total" -gt 204800 ]; then
            echo "::error::bundle budget exceeded: ${total} > 204800 bytes gzip"
            exit 1
          fi
      # The Playwright suites (assertions + screenshot comparison) live in
      # visual-regression.yml: they need a built fixture server and two browser
      # engines, they are path-filtered to UI changes, and the comparison must
      # not fail a check. Building the SPA above stays here regardless — the Go
      # embed needs real assets.

  # Benchmark job: perf budgets are measured on main so the
  # numbers are visible per commit and regressions trend in the log. NOT
  # blocking here — regressions block release, not every PR;
  # release.yml runs the same budget test as a hard release gate.
  # main-only (2026-10-10): a PR's perf numbers are noise — the runner is
  # shared and a same-branch re-run can differ by an order of magnitude — so
  # they cost runner minutes without telling anyone anything. The trend that
  # matters is per commit on main.
  benchmark:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: perf budgets (TestPerfBudgets, verbose)
        # report mode: shared runners can be neighbor-loaded for a whole
        # run (observed 31-140 ms batches for code measuring 2.6 ms on
        # quiet runners) — on main the numbers matter, the hard gate is
        # the release pipeline's perf-budgets job.
        env:
          PROXYLLM_PERF_BUDGETS: report
        run: go test ./internal/e2e -run TestPerfBudgets -v -count=1
      - name: benchmark baselines
        run: go test ./internal/e2e -bench . -benchtime=200x -run xxx -v

  # Gate 6: Docker image build — blocking
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: proxyllm:ci
      - name: Smoke test container
        run: |
          docker run -d --rm --name proxyllm-ci -p 18080:8080 proxyllm:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:18080/healthz >/dev/null 2>&1; then
              echo "health check passed (attempt ${attempt})"
              docker stop proxyllm-ci
              exit 0
            fi
            sleep 1
          done
          echo "health check FAILED after 30 attempts"
          docker logs proxyllm-ci
          docker stop proxyllm-ci || true
          exit 1

  # Gate 7: workflow syntax. Workflows are code, and a YAML typo or an unknown
  # step key does not fail just that workflow — it fails EVERY run in the same
  # push (GitHub marks the whole push as a workflow-file issue), which is the
  # most confusing failure mode this repo has hit. actionlint validates the
  # schema and the expressions, so such a change fails here instead.
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2.2.0
