name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # security-events: write — the CodeQL analyze step uploads its SARIF
  # results; with only contents: read it fails with
  # "Resource not accessible by integration".
  # actions: read — the same step queries the workflow-run API for its
  # status reporting; on private repos the GITHUB_TOKEN integration
  # refuses that call without it (the upload aborts with
  # "Resource not accessible by integration").
  contents: read
  security-events: write
  actions: read

env:
  # Go packages scoped to the module's own code — `./...` would descend
  # into webui/node_modules (some npm packages ship Go sources) and break
  # vet/test/lint runs (Makefile GO_PKGS parity).
  GO_PKGS: ./cmd/... ./internal/... ./webui

jobs:
  # Gate 1: lint + format + static analysis — blocking
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt check
        run: test -z "$(gofmt -l cmd internal webui/embed.go)"
      - name: go vet
        run: go vet $GO_PKGS
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  # Gate 2+3: unit + contract tests with race detector — blocking
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go test -race
        run: go test -race $GO_PKGS
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  # Gate 5: secret scan + SAST + dependency audit — blocking
  # gosec rides Gate 1 via golangci-lint (gosec linter enabled, nolintlint
  # enforcing annotated suppressions) — a standalone gosec CLI run would
  # ignore the //nolint:gosec annotations and double-report.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  # Gate 4: WebUI build + bundle budget + visual regression — blocking
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: npm ci
        working-directory: webui
        run: npm ci
      - name: lint
        working-directory: webui
        run: npm run lint
      - name: typecheck (src)
        working-directory: webui
        run: npm run typecheck
      - name: typecheck (e2e)
        working-directory: webui
        run: npx tsc --noEmit -p tsconfig.e2e.json
      # npm run build overwrites the committed dist placeholder with the
      # real bundle — required here so the Go embed picks up real assets.
      - name: build SPA
        working-directory: webui
        run: npm run build
      - name: bundle budget (≤ 200 KB gzip initial load)
        working-directory: webui
        run: |
          total=$(node -e '
            const fs = require("fs");
            const zlib = require("zlib");
            const html = fs.readFileSync("dist/index.html", "utf8");
            const refs = [...html.matchAll(/(?:src|href)="(\/?assets\/[^"]+)"/g)].map((m) => m[1]);
            let gz = 0;
            for (const r of refs) {
              const p = r.startsWith("/") ? r.slice(1) : r;
              gz += zlib.gzipSync(fs.readFileSync("dist/" + p)).length;
            }
            gz += zlib.gzipSync(fs.readFileSync("dist/index.html")).length;
            console.log(gz);
          ')
          echo "initial load: ${total} bytes gzip"
          if [ "$total" -gt 204800 ]; then
            echo "::error::bundle budget exceeded: ${total} > 204800 bytes gzip"
            exit 1
          fi
      # V-4: the seeded suite runs two projects: desktop-chrome (chromium
      # engine) and iphone-13 (the iPhone 13 device descriptor maps to the
      # webkit engine — installing only chromium fails every mobile test);
      # baselines are captured in CI, never locally (V-3).
      - name: install Playwright browsers
        working-directory: webui
        run: npx playwright install --with-deps chromium webkit
      - name: build fixture server
        run: |
          go build -o webui/e2e/fixturesrv-bin ./webui/e2e/fixturesrv
      - name: visual regression (seeded)
        working-directory: webui
        run: npx playwright test -c playwright.config.ts
      - name: visual regression (empty states)
        working-directory: webui
        run: npx playwright test -c playwright.empty.config.ts
      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            webui/e2e/.artifacts
            webui/e2e/.artifacts-empty
          # retention-days and if-no-files-found are upload-artifact inputs —
          # as step-level keys they make the workflow unparseable (GitHub
          # rejects unknown step keys; js-yaml does not validate the schema).
          retention-days: 7
          if-no-files-found: ignore

  # Benchmark job (plan §8): perf budgets are measured on main so the
  # numbers are visible per commit and regressions trend in the log. NOT
  # blocking here — plan §8: "regressions block release, not every PR";
  # release.yml runs the same budget test as a hard release gate.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: perf budgets (TestPerfBudgets, verbose)
        run: go test ./internal/e2e -run TestPerfBudgets -v -count=1
      - name: benchmark baselines
        run: go test ./internal/e2e -bench . -benchtime=200x -run xxx -v

  # Gate 6: Docker image build — blocking
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: proxyllm:ci
      - name: Smoke test container
        run: |
          docker run -d --rm --name proxyllm-ci -p 18080:8080 proxyllm:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/healthz >/dev/null 2>&1; then
              echo "health check passed"
              docker stop proxyllm-ci
              exit 0
            fi
            sleep 1
          done
          echo "health check FAILED"
          docker logs proxyllm-ci
          docker stop proxyllm-ci || true
          exit 1