# PROxyLLM deployment — single service, single data directory.
#
# Runs the published multi-arch image (amd64 + arm64). Copy it out of the
# checkout (or curl it from the repo) and adjust to taste:
#
#   docker compose up -d
#
# Development from a source checkout: point the image at a local build —
#   IMAGE=proxyllm:dev make docker
# (the Makefile target builds and starts the same file via the IMAGE
# override below; no second compose file exists).

name: proxyllm

services:
  proxyllm:
    # Pin a release tag for reproducible deployments; :latest tracks the
    # newest release. IMAGE overrides the default for local development.
    image: ${IMAGE:-ghcr.io/tubeof/proxyllm:v1.15.0}
    # Run as root: the bind-mounted ./data is owned by the invoking user
    # (or created by Docker as root), and a fixed non-root UID inside the
    # container cannot be made to match every host — root sidesteps the
    # ownership question entirely and works on any host, including
    # Docker Desktop file sharing. The rest of the hardening profile
    # stays (read-only rootfs, dropped capabilities, limits).
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      # The only writable path: SQLite DB + envelope master key live here.
      # Back this directory up — together the two files are the full state.
      - ./data:/data
    environment:
      PROXYLLM_SERVER_ADDR: ":8080"
      # Optional overrides — see docs/configuration.md:
      # PROXYLLM_LOG_LEVEL: "info"
      # PROXYLLM_LOG_FORMAT: "json"
    # Read-only rootfs — /data (bind mount) is the only writable path;
    # /tmp is a size-capped tmpfs for runtime scratch.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    # A wedging container is restarted instead of wedged forever
    # (healthcheck + resource limits work as a pair).
    mem_limit: 384m
    healthcheck:
      # The binary probes its own health endpoint — distroless has no curl.
      test: ["CMD", "/proxyllm", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped