# PROxyLLM — single service, single data directory.
services:
  proxyllm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # The only writable path: SQLite DB + envelope master key live here.
      - ./data:/data
    environment:
      PROXYLLM_SERVER_ADDR: ":8080"
    # Phase 0: read-only rootfs can be enabled once all runtime writes
    # target /data. Uncomment after verification.
    # read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/proxyllm", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped