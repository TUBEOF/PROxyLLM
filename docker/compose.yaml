# PROxyLLM — single service, single data directory.
services:
  proxyllm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # The only writable path: SQLite DB + envelope master key live here.
      - ./data:/data
    environment:
      PROXYLLM_SERVER_ADDR: ":8080"
    # ADR-007 control 6: read-only rootfs — /data (bind mount) is the only
    # writable path; /tmp is a size-capped tmpfs for runtime scratch.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    pids_limit: 100
    # Plan §8 perf budget: RSS ≤ 128 MB @ 100 concurrent streams (verified
    # in the phase-3 report); the limit gives headroom over the budget —
    # a wedging container is restarted instead of wedged forever (research
    # D-1: healthcheck + resource limits work as a pair).
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/proxyllm", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped