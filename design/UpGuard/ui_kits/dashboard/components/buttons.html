<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Kit — Buttons</title>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="../kit.css">
<style>
  .pad{padding:40px 24px;max-width:820px;margin:0 auto}
  .pad h1{font-family:var(--font-display);font-size:24px;font-weight:600;margin:0 0 6px}
  .pad .lead{color:var(--muted);font-size:14px;margin:0 0 28px}
  .blk{margin-bottom:30px}
  .blk h2{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--widget-head);margin:0 0 12px}
  .inline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .card-surface{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);backdrop-filter:blur(var(--blur-card));padding:24px}
</style>
</head>
<body data-od-id="comp-buttons">

<svg class="dash-icons" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="pad">
  <h1>Buttons</h1>
  <p class="lead">Dashboard-Varianten der Marketing-Pille: Primary, Ghost, Secondary, Danger plus Small, Icon-only und Button-Group.</p>

  <div class="blk card-surface" data-od-id="buttons-variants">
    <h2>Varianten</h2>
    <div class="inline">
      <button class="btn btn-primary"><svg width="14" height="14"><use href="#i-plus"/></svg> Monitor hinzufügen</button>
      <button class="btn btn-secondary">Filter</button>
      <button class="btn btn-ghost">Als CSV exportieren</button>
      <button class="btn btn-danger"><svg width="14" height="14"><use href="#i-trash"/></svg> Löschen</button>
    </div>
  </div>

  <div class="blk card-surface" data-od-id="buttons-sizes">
    <h2>Größen & Icon-only</h2>
    <div class="inline">
      <button class="btn btn-primary btn-sm">Klein</button>
      <button class="btn btn-primary">Standard</button>
      <button class="btn btn-secondary btn-icon" style="width:36px;height:36px"><svg width="16" height="16"><use href="#i-download"/></svg></button>
      <button class="btn btn-secondary btn-icon" style="width:36px;height:36px"><svg width="16" height="16"><use href="#i-trash"/></svg></button>
    </div>
  </div>

  <div class="blk card-surface" data-od-id="buttons-group">
    <h2>Button-Group</h2>
    <div class="btn-group">
      <button class="btn btn-secondary">Tag</button>
      <button class="btn btn-secondary" style="color:var(--accent);border-color:var(--accent)">Woche</button>
      <button class="btn btn-secondary">Monat</button>
    </div>
  </div>
</div>

</body>
</html>
