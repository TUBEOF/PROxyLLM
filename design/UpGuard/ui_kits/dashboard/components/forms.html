<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Kit — Formulare</title>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="../kit.css">
<style>
  .pad{padding:40px 24px;max-width:760px;margin:0 auto}
  .pad h1{font-family:var(--font-display);font-size:24px;font-weight:600;margin:0 0 6px}
  .pad .lead{color:var(--muted);font-size:14px;margin:0 0 28px}
  .blk{margin-bottom:36px}
  .blk h2{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--widget-head);margin:0 0 12px}
  .card-surface{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);backdrop-filter:blur(var(--blur-card));padding:24px}
</style>
</head>
<body data-od-id="comp-forms">

<svg class="dash-icons" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M10.3 4 2.5 18a1 1 0 0 0 .9 1.5h17.2a1 1 0 0 0 .9-1.5L13.7 4a1 1 0 0 0-1.7 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1.5 1.5M14 11a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6L12.5 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="pad">
  <h1>Formulare</h1>
  <p class="lead">Felder mit Labels oben, Glas-Fokus-Ring, Validierungszustände, Input-Affixes und Fieldset-Gruppierung. Touch-Ziele ≥ 40px.</p>

  <div class="blk card-surface" data-od-id="form-monitor">
    <h2>Monitor erstellen</h2>
    <div class="form">
      <div class="field">
        <label for="m-name">Monitor-Name <span class="req">*</span></label>
        <input class="input" id="m-name" type="text" placeholder="z. B. api.production.app" value="api.production.app">
        <span class="hint">Lesbarer Name, der in Listen und Alarmen angezeigt wird.</span>
      </div>

      <div class="field">
        <label for="m-url">URL / Host <span class="req">*</span></label>
        <div class="input-affix">
          <svg class="ic" width="16" height="16"><use href="#i-link"/></svg>
          <input class="input" id="m-url" type="url" placeholder="api.your-domain.com/health">
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="m-type">Monitor-Typ</label>
          <div class="field has-select" style="position:relative">
            <select id="m-type">
              <option>Website (HTTP/s)</option>
              <option>Keyword</option>
              <option>Ping</option>
              <option>Port</option>
              <option>Cron-Job</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="m-interval">Prüfintervall</label>
          <div class="input-affix">
            <input class="input" id="m-interval" type="number" value="30">
            <span class="suffix">Sekunden</span>
          </div>
        </div>
      </div>

      <div class="field is-error">
        <label for="m-timeout">Timeout <span class="req">*</span></label>
        <input class="input" id="m-timeout" type="number" value="0">
        <span class="error"><svg width="13" height="13"><use href="#i-alert"/></svg> Timeout muss größer als 0 sein.</span>
      </div>

      <div class="field is-valid">
        <label for="m-note">Notiz</label>
        <textarea class="textarea" id="m-note" placeholder="Optionale Beschreibung für das Team…">Wird von der Checkout-Pipeline genutzt.</textarea>
      </div>

      <fieldset class="fieldset">
        <legend>Benachrichtigungen</legend>
        <div class="form" style="gap:14px">
          <label class="toggle"><input type="checkbox" checked><span class="tswitch"></span> E-Mail bei Ausfall</label>
          <label class="toggle"><input type="checkbox"><span class="tswitch"></span> Push-Benachrichtigung</label>
          <div class="field" style="margin-top:4px">
            <label for="m-team">Zuständiges Team</label>
            <div class="field has-select" style="position:relative">
              <select id="m-team">
                <option>Platform / SRE</option>
                <option>Checkout-Team</option>
                <option>Externer Dienstleister</option>
              </select>
            </div>
          </div>
        </div>
      </fieldset>

      <div class="form-actions">
        <button class="btn btn-secondary">Abbrechen</button>
        <button class="btn btn-primary">Monitor speichern</button>
      </div>
    </div>
  </div>

  <div class="blk card-surface" data-od-id="form-search">
    <h2>Suchfeld (Affix)</h2>
    <div class="input-affix" style="max-width:420px">
      <svg class="ic" width="16" height="16"><use href="#i-search"/></svg>
      <input class="input" type="search" placeholder="Monitor, Host oder ID suchen…">
    </div>
  </div>
</div>

</body>
</html>
