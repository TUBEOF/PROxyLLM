<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview — Formulare & Controls</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/dashboard/kit.css">
<style>
  .pad{padding:40px 24px;max-width:720px;margin:0 auto}
  .pad>h1{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0 0 4px}
  .pad>.lead{color:var(--muted);font-size:14px;margin:0 0 24px}
  .panel{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);backdrop-filter:blur(var(--blur-card));padding:24px}
  .blk{margin-bottom:24px}
  .blk h2{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--widget-head);margin:0 0 10px}
</style>
</head>
<body data-od-id="preview-dashboard-forms">

<svg class="dash-icons" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 18v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1.5 1.5M14 11a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6L12.5 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<div class="pad">
  <h1>Formulare & Buttons</h1>
  <p class="lead">Vorschau-Karte — Felder mit Labels, Validierung, Input-Affix, Fieldset, Auswahl-Controls und Button-Varianten.</p>

  <div class="blk panel">
    <div class="form">
      <div class="field"><label for="n">Monitor-Name <span class="req">*</span></label><input class="input" id="n" value="api.production.app"><span class="hint">Lesbarer Name für Listen und Alarme.</span></div>
      <div class="field"><label for="u">URL / Host <span class="req">*</span></label><div class="input-affix"><svg class="ic" width="16" height="16"><use href="#i-link"/></svg><input class="input" id="u" type="url" placeholder="api.your-domain.com/health"></div></div>
      <div class="form-row">
        <div class="field"><label for="t">Monitor-Typ</label><div class="field has-select" style="position:relative"><select id="t"><option>Website (HTTP/s)</option><option>Keyword</option><option>Ping</option><option>Port</option><option>Cron-Job</option></select></div></div>
        <div class="field"><label for="iv">Prüfintervall</label><div class="input-affix"><input class="input" id="iv" type="number" value="30"><span class="suffix">Sek.</span></div></div>
      </div>
      <div class="field is-error"><label for="to">Timeout <span class="req">*</span></label><input class="input" id="to" type="number" value="0"><span class="error"><svg width="13" height="13"><use href="#i-alert"/></svg> Timeout muss größer als 0 sein.</span></div>
      <fieldset class="fieldset"><legend>Benachrichtigungen</legend>
        <div style="display:flex;flex-direction:column;gap:12px">
          <label class="toggle"><input type="checkbox" checked><span class="tswitch"></span> E-Mail bei Ausfall</label>
          <label class="check"><input type="checkbox" checked><span class="cbox"><svg width="12" height="12"><use href="#i-check"/></svg></span> An Team weiterleiten</label>
        </div>
      </fieldset>
      <div class="form-actions"><button class="btn btn-secondary">Abbrechen</button><button class="btn btn-primary">Monitor speichern</button></div>
    </div>
  </div>

  <div class="blk">
    <h2>Buttons & Suche</h2>
    <div class="panel" style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-ghost">Ghost</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-primary btn-sm">Klein</button>
      </div>
      <div class="input-affix" style="max-width:380px"><svg class="ic" width="16" height="16"><use href="#i-search"/></svg><input class="input" type="search" placeholder="Monitor, Host oder ID suchen…"></div>
    </div>
  </div>
</div>
</body>
</html>
